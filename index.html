<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SortViz Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>SortViz Studio</h1>
                    <p>인터랙티브 정렬 알고리즘 시각화 파이프라인</p>
                </div>
                <!-- [신규 추가] 테마 토글 버튼 -->
                <button id="theme-toggle-btn" class="theme-btn">
                    <span id="theme-icon">☀️</span> <span id="theme-text">라이트 모드</span>
                </button>
            </div>
        </header>

        <!-- 상단 컨트롤 영역 -->
        <section class="controls">
            <div class="control-row">
                <div class="control-group flex-1">
                    <label for="algorithm-select">알고리즘 선택</label>
                    <select id="algorithm-select">
                        <option value="bubble">버블 정렬 (Bubble Sort)</option>
                        <option value="selection">선택 정렬 (Selection Sort)</option>
                        <option value="insertion">삽입 정렬 (Insertion Sort)</option>
                        <option value="merge">병합 정렬 (Merge Sort)</option>
                        <option value="quick">퀵 정렬 (Quick Sort)</option>
                    </select>
                </div>

                <div class="control-group flex-1">
                    <label for="custom-array-input">커스텀 배열 입력</label>
                    <div class="input-with-btn">
                        <input type="text" id="custom-array-input" placeholder="예: 25, 80, 15, 40, 60">
                        <button id="apply-array-btn">적용</button>
                    </div>
                </div>
            </div>

            <div class="control-row">
                <div class="control-group flex-1">
                    <label for="speed-range">속도 제어</label>
                    <input type="range" id="speed-range" min="10" max="500" value="100">
                </div>

                <div class="button-group">
                    <button id="generate-btn">랜덤 생성</button>
                    <button id="start-btn" class="primary-btn">정렬 시작</button>
                </div>
            </div>
        </section>

        <!-- 시각화 영역 -->
        <section class="visualization-container">
            <div id="bar-container"></div>
        </section>

        <!-- [신규 추가] 실시간 정렬 단계 표 영역 -->
        <section class="table-container">
            <div class="table-header">
                <h3>실시간 정렬 단계 (Step History)</h3>
                <button id="clear-table-btn" class="sm-btn">기록 초기화</button>
            </div>
            <div class="table-wrapper">
                <table id="step-table">
                    <thead>
                        <tr>
                            <th style="width: 70px;">단계</th>
                            <th style="width: 140px;">동작 구분</th>
                            <th>현재 배열 상태</th>
                        </tr>
                    </thead>
                    <tbody id="step-table-body">
                        <tr>
                            <td colspan="3" class="empty-msg">정렬이 시작되면 이 곳에 단계별 기록이 표시됩니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 정보 카드 영역 -->
        <section class="description-card">
            <h2 id="desc-title">알고리즘 설명</h2>
            <p id="desc-content">알고리즘을 선택하고 정렬 시작 버튼을 누르세요.</p>
            <div class="complexity-info">
                시간 복잡도: <strong id="desc-complexity">-</strong>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
